[phases.setup]
nixPkgs = ['python3', 'postgresql_16', 'gcc', 'nodejs', 'wkhtmltopdf', 'fontconfig']

[phases.install]
cmds = [
    'python -m pip install --upgrade pip',
    'pip install -r requirements.txt'
]

[start]
cmd = 'python odoo-bin --config=odoo.conf --load-language=pt_BR --without-demo=all'
