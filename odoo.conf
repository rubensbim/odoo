[options]
# Configuração básica do Odoo para Railway
addons_path = addons
admin_passwd = admin123
http_port = 8069
logfile = False
log_level = info

# Configurações de banco (Railway vai injetar automaticamente)
db_host = ${PGHOST}
db_port = ${PGPORT}
db_user = ${PGUSER}
db_password = ${PGPASSWORD}
db_name = ${PGDATABASE}

# Performance para Railway
workers = 1
max_cron_threads = 1
limit_memory_hard = 1073741824
limit_memory_soft = 805306368

# Outros
without_demo = all
list_db = False
